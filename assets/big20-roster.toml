# The Big 20: twenty NES games raced back to back, in a fixed order.
#
# Source: https://thebig20nes.com/race-23/ (race #23, 2026-10-10). This is
# somebody else's event with a published list, so unlike the Arcathlon
# rosters — which were reconstructed from the boards by OCR and voting —
# these names are ground truth and should be corrected only against that
# site.
#
# SEPARATE FROM assets/arcathlon-rosters.toml on purpose. `Rosters::identify`
# picks the event whose games most of a board's names fit, and the pool
# fallback assumes each game belongs to exactly ONE event in the file. Mega
# Man 6 is in both Arcathlon #9 and this race, so merging the two files would
# break that assumption for every board either way.
#
# What it is FOR, today: the Big 20 is not a marathon board — each game is its
# own splits file with its own attempt counter — so there is no board to
# identify. These names are used to recognise a game the pane is timing that
# is KNOWN NOT TO BE the tracked one, which is stronger evidence than a
# header simply failing to match (see src/identity.rs). Canonicalising runs
# under them comes when the tracker records these games at all.
#
# `goals` is what each game has to be finished to, matched to `games` BY
# POSITION (the parser refuses a list of a different length). The goal is a
# property of the race and not of the game — it changes between races — which
# is why it lives here, in the file that IS one race, rather than anywhere a
# game is named. Nothing in the matcher reads it; the Big 20 prep page shows
# it, which is why it is data now and was a comment before.
#
# The order is the race order, and that is also load-bearing: the prep page
# lists the twenty in the sequence he will run them.

[[event]]
name = "#23"
url = "https://thebig20nes.com/race-23/"
date = "2026-10-10"
games = [
  "Die Hard",
  "Pac-Mania",
  "Double Dragon II: The Revenge",
  "Crisis Force",
  "Kid Klown in Night Mayor World",
  "Excitebike",
  "Uninvited",
  "Steel Legion",
  "Faria",
  "Monster Party",
  "Parallel World",
  "Mega Man 6",
  "New Ghostbusters II",
  "Mini Putt",
  "The Flintstones: Surprise at Dinosaur Peak",
  "Hydlide",
  "Yoshi",
  "Celeste Mario's Zap n Dash",
  "Jaws",
  "Moon Crystal",
]
goals = [
  "Any% Beginner",
  "From Sandbox to End Loop 1",
  "Beat Game (Normal)",
  "3 Stages",
  "Any%",
  "Selection A",
  "Any%",
  "Any% All Bosses",
  "Save Princess / Dungeon 1",
  "Watch us dance / Round 5",
  "World 3 thru 4",
  "Beat X4 Password Start",
  "Beat Stage 3",
  "Beat Any Course",
  "Any% No Manip",
  "3 Fairies",
  "A Type Any%",
  "Any%",
  "Any%",
  "Any%",
]
