# Names worth an eye, and why they are spelled the way they are:
#
#   "LOTW" (#7) is Legacy of the Wizard, and the randomized boards write it
#     "Leg of Wizard" — he abbreviates the same game more than one way. Both
#     read as initialisms of the full title, which is how they are folded
#     together.
#   "Kabuki Quantum Fighter" (#5) becomes "Kabuki Q Fighter" when randomized.
#   "Duck Tales" (#5) and "Duck Tales 2" (#8) are the two of them. Both
#     numbered boards print them WITH the space, in all 1184 readings of #8's;
#     "DuckTales" unspaced appears only on the randomized boards and means
#     #5's, which its 8-9 minute times confirm against #8's 11-12. (This note
#     used to say the reverse, and was wrong in both directions.)
#   "Chip N Dale" (#3) and "Chip 'n Dale 2" (#7) are the two Rescue Rangers.
#     The ROM picker cannot tell them apart — its filename field clips at 21
#     characters and both read "Chip 'n Dale - Rescue" — so they are settled
#     from the games themselves: #3 is the kitchen stage with plain crates,
#     #7 the sewer with RR-emblem crates. Same for the three TMNTs, which all
#     clip to "Teenage Mutant Ninja": #2 has an overworld, #3 is the arcade
#     beat-em-up, #4 the Manhattan Project boardwalk. Those five are the only
#     prefix collisions among the ninety.
#   "Adventure Island 4" (#9) is confirmed, and the note that once stood here
#     calling its number a guess is retired. The board prints a crisp Arabic
#     4 (811 clean readings), the ROM picker line 01 reads "Takahashi Meijin
#     no B...", and the game's own title screen carries "©1994 HUDSON SOFT" —
#     1994 is Bouken Jima IV alone (I 1986, II 1991, III 1992).
#   "Crystal Palace" (#7) is exactly what the board prints.
#   "Jackie Chan" (#7) is Jackie Chan's Action Kung Fu.
#   "Déjà Vu" (#7) is here because a colour crop found it: every OCR pass
#     discarded it, the accents leaving no three ASCII letters in a row.
#   "D.S. Indy Heat" (#7) is the board's own abbreviation of Danny Sullivan's
#     Indy Heat.
#   One Mega Man per event: 1 in #2, then 2, 3, 4, 5 and 6 in #3, #6, #7, #8
#     and #9.
