# The rosters of a marathon event, one `[[event]]` per board.
#
# A marathon board prints ten game names and the bot records each completed
# row under the name it read. OCR loses a leading character ("nax" for
# Astyanax), damages a numeral ("Castlevania Il"), and the runner abbreviates
# his own board differently on a randomized draw ("Kabuki Q Fighter"), so one
# game accumulates a history under half a dozen spellings and `runs.game`
# groups by exact string. This file is the list of names those readings are
# folded onto: the bot works out which roster a board is from the names it
# read, then files every row of it under one of that roster's ten.
#
# Which is why the rosters, and not just a list of ninety names, are what is
# needed. "Castlevania" fits three of the ninety, "Duck Tales" two and "Mega
# Man" six — but each event holds exactly one of each family, so inside one
# roster there is nothing to confuse and a fragment of a name is enough. A
# board that fits no roster (a randomized draw crosses all nine) falls back to
# the whole pool, where a trailing sequel number then has to agree exactly.
#
# It is data, not code: correcting a name here needs no rebuild, and another
# streamer's event is another file. Point a board-mode `[[games]]` entry at
# one with `roster = "assets/arcathlon-rosters.toml"`.
#
# These ninety are read off 38 replayed broadcasts, July 9 to August 28 2026 —
# four full cycles of his nine numbered events, so each name is a vote across
# cycles rather than one reading. Names are spelled as the board prints them,
# abbreviations and all, because that is what a run is filed under. Games are
# listed in the order the board shows them, which for these events is
# alphabetical. No randomized draw over those broadcasts produced a game
# outside this list.

[[event]]
name = "#1"
# The board says just "Arcathlon" on this one — no number.
games = [
