<!-- One Arcathlon, as its own page. Rendered once per event by
     scripts/build-site.sh, which splices the event's slice of the report
     into the empty data script below, as it does for site/template.html.
     Do not write the placeholder's name in prose anywhere in this file: the
     splice takes the whole line, and a mention in a comment silently ate
     the data once already.

     Two shapes share this template because they share a subject:
       kind "series" — one of the nine NUMBERED events. Its ten games are
         fixed and it ran three or four times, so the page is a grid: ten
         rows, one column per cycle. The repetition IS the content.
       kind "draw"   — one of the randomized Arcathlons. Ten games pulled
         from all ninety, once, never to recur. There is nothing to compare
         it against, so the page records the day instead of charting it.
       kind "game"   — ONE game, every time he has run it, across whichever
         events it belongs to. A game of a numbered event recurs on a
         schedule; one that has only ever come up in a draw may have a
         single line. Both are worth a page.

     The page names games, never the streamer. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Martian+Mono:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0b20; --card: #161230; --ink: #eceefc; --ink2: #a2a6c8;
    --muted: #6d7194; --hairline: rgba(130,140,255,.13); --series: #3987e5;
    --gold: #e8b23a; --gold-soft: rgba(232,178,58,.13); --ahead: #58d8a0;
  }
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f2f2ec; --card: #ffffff; --ink: #171425; --ink2: #4e5170;
    --muted: #83879f; --hairline: rgba(20,15,60,.11); --series: #2a78d6;
    --gold: #a9791a; --gold-soft: rgba(169,121,26,.12); --ahead: #1f8f63;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d0b20; --card: #161230; --ink: #eceefc; --ink2: #a2a6c8;
      --muted: #6d7194; --hairline: rgba(130,140,255,.13); --series: #3987e5;
      --gold: #e8b23a; --gold-soft: rgba(232,178,58,.13); --ahead: #58d8a0;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0b20; --card: #161230; --ink: #eceefc; --ink2: #a2a6c8;
    --muted: #6d7194; --hairline: rgba(130,140,255,.13); --series: #3987e5;
    --gold: #e8b23a; --gold-soft: rgba(232,178,58,.13); --ahead: #58d8a0;
  }
  body {
    background: var(--bg); color: var(--ink); margin: 0;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }
  a { color: var(--series); }
  .back {
    font-family: "Silkscreen", monospace; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; text-decoration: none; color: var(--muted);
  }
  .back:hover { color: var(--ink); }
  h1 { font-size: clamp(22px, 4vw, 32px); margin: 14px 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  .badge {
    font-family: "Silkscreen", monospace; font-size: 9px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--gold); vertical-align: 3px;
    border: 1px solid var(--gold-soft); border-radius: 3px; padding: 3px 7px 2px;
    margin-left: 10px; white-space: nowrap;
  }
  .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 8px; padding: 18px 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left; font-weight: 500; color: var(--muted); font-size: 11px;
    letter-spacing: .04em; text-transform: uppercase; padding: 0 10px 8px 0;
    border-bottom: 1px solid var(--hairline); white-space: nowrap;
  }
  td { padding: 8px 10px 8px 0; border-top: 1px solid var(--hairline); }
  th.num, td.num { text-align: right; padding-right: 0; }
  .tnum { font-family: "Martian Mono", monospace; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .n { color: var(--muted); width: 2em; }
  /* The fastest cycle of a row, which is the point of laying them side by side. */
  .best { color: var(--gold); font-weight: 600; }
  .none { color: var(--muted); }
  tfoot td { border-top: 2px solid var(--hairline); color: var(--ink2); font-weight: 600; }
  .scroll { overflow-x: auto; }
  .note { color: var(--muted); font-size: 12.5px; margin: 18px 0 0; }
  footer { margin-top: 34px; color: var(--muted); font-size: 12px; }
  /* A PRACTICE game's page: tiles for the figures, a chart of every
     attempt, then the attempts by day. */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 0 0 14px; }
  .tile { background: var(--card); border: 1px solid var(--hairline); border-radius: 8px; padding: 12px 14px 10px; }
  .tile b { display: block; font-family: "Martian Mono", monospace; font-size: 20px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .tile b.gold { color: var(--gold); }
  .tile span { display: block; color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; margin-top: 4px; }
  .tile small { color: var(--ink2); font-size: 12px; display: block; margin-top: 2px; }
  .chart { margin: 0 0 14px; padding: 14px 16px 10px; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart .grid { stroke: var(--hairline); stroke-width: 1; }
  .chart .lbl { fill: var(--muted); font-size: 10px; font-family: "Martian Mono", monospace; }
  .chart .line { fill: none; stroke: var(--gold); stroke-width: 1.4; opacity: .85; }
  .chart .fin { fill: var(--gold); }
  .chart .pb { fill: var(--ahead); }
  .chart .rs { stroke: var(--muted); stroke-width: 2; opacity: .55; }
  .chart .goalline { stroke: var(--series); stroke-width: 1; stroke-dasharray: 3 3; opacity: .7; }
  .legend { color: var(--muted); font-size: 11.5px; margin: 8px 0 0; display: flex; gap: 16px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .legend i.fin { background: var(--gold); }
  .legend i.pb { background: var(--ahead); }
  .legend i.rs { background: var(--muted); border-radius: 1px; width: 3px; height: 9px; }
  .legend i.mar { background: var(--series); width: 12px; height: 2px; border-radius: 0; vertical-align: 3px; }
  tr.day td { border-top: 2px solid var(--hairline); padding-top: 12px; color: var(--ink2); font-weight: 600; }
  tr.day td small { color: var(--muted); font-weight: 400; margin-left: 10px; }
  th.bar, td.bar { width: 34%; min-width: 120px; padding-left: 18px; }
  .depth { position: relative; height: 8px; border-radius: 2px; background: rgba(130,140,255,.10); overflow: hidden; }
  .depth i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--muted); opacity: .6; }
  .depth i.fin { background: var(--gold); opacity: 1; }
  .depth i.pb { background: var(--ahead); opacity: 1; }
  .delta { color: var(--muted); font-size: 11.5px; }
  .tag {
    font-family: "Silkscreen", monospace; font-size: 8px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ahead); margin-left: 8px; vertical-align: 2px;
  }
</style>

<div class="wrap">
  <a class="back" href="/">&larr; all games</a>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="tiles" id="tiles" hidden></div>
  <section class="card chart" id="chart" hidden></section>
  <section class="card scroll"><table id="grid"></table></section>
  <p class="note" id="note"></p>
  <footer>Times read off the on-screen LiveSplit board, frame by frame · <a href="/api/v1/README.md">data</a></footer>
</div>

<script id="data" type="application/json">
__DATA__
</script>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
// Game names are OCR of a video stream and reach the page as arbitrary text.
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = ms => {
  if (ms == null) return '—';
  const t = Math.floor(ms / 100) / 10;
  const m = Math.floor(t / 60), s = (t - m * 60).toFixed(1).padStart(4, '0');
  return m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}:${s}` : `${m}:${s}`;
};
const TZ = (D.day_offset_minutes || 0) * 60000;
const dshort = ms => new Date(ms + TZ).toLocaleDateString(undefined,
  { month: 'short', day: 'numeric', timeZone: 'UTC' });

document.title = D.title;
document.getElementById('title').innerHTML =
  esc(D.title) + (D.kind === 'draw' ? '<span class="badge">random draw</span>' : '');

if (D.kind === 'game') {
  // One game, every running of it. Two shapes share this page:
  //   a MARATHON game: one completion per event, oldest last. The event
  //     column matters, because a game can reach the board on its own
  //     numbered event's schedule and again in a random draw.
  //   a PRACTICE game: every attempt, most of them resets, newest first.
  //     The event column is meaningless here — it would be the practice-day
  //     card's label, "5 games" — and what matters is the attempt number
  //     and, for a reset, how far the timer got. This is what the Big 20
  //     pages are.
  const runs = D.runs;
  const practice = runs.some(r => r.practice);
  const times = runs.map(r => r.final_time_ms).filter(t => t != null);
  const best = times.length ? Math.min(...times) : null;
  const played = runs.length;
  const byTime = [...runs].sort((a, b) => a.started_at_ms - b.started_at_ms);
  const span = played > 1
    ? ` · ${dshort(byTime[0].started_at_ms)} to ${dshort(byTime[byTime.length - 1].started_at_ms)}` : '';
  // A marathon row is a COMPLETION, so "run 5 times" is five finishes. A
  // practice game's rows are ATTEMPTS, most of which end in a reset, and
  // the same phrase over forty of them would claim forty runs of the game.
  const counts = times.length < played
    ? `${played} attempt${played > 1 ? 's' : ''}, ${times.length} finished`
    : `run ${played} time${played > 1 ? 's' : ''}`;
  const race = D.race
    ? `Big 20 ${D.race.name} · game ${D.race.n}${D.race.goal ? ' · ' + D.race.goal : ''} · ` : '';
  document.getElementById('sub').textContent =
    race + counts + (best != null ? ` · best ${fmt(best)}` : '') + span;
  if (practice) {
    // Practice rows only from here on; a marathon completion of the same
    // game is real but not practice, and it is listed apart at the end.
    const marathon = D.runs.filter(r => !r.practice).sort((a, b) => a.started_at_ms - b.started_at_ms);
    const byTime = D.runs.filter(r => r.practice).sort((a, b) => a.started_at_ms - b.started_at_ms);
    const played = byTime.length;
    // Every attempt in time order with the running best alongside: a
    // finish that beat everything before it is a new best, and a reset is
    // worth exactly how far the timer got.
    let running = null;
    for (const r of byTime) {
      r.fin = r.final_time_ms != null;
      r.pb = r.fin && (running == null || r.final_time_ms < running);
      if (r.pb) running = r.final_time_ms;
      r.depth = r.fin ? r.final_time_ms : r.last_timer_ms;
    }
    const fins = byTime.filter(r => r.fin);
    const bestRun = fins.reduce((m, r) => (m == null || r.final_time_ms < m.final_time_ms) ? r : m, null);
    const latest = fins.length ? fins[fins.length - 1] : null;
    const avg = fins.length ? fins.reduce((n, r) => n + r.final_time_ms, 0) / fins.length : null;
    const days = [...new Set(byTime.map(r => r.day))];
    const rate = played ? Math.round(100 * fins.length / played) : 0;
    const R = D.race;
    // His own counter, where the bot read it: how many attempts it saw
    // against how many the counter says there were.
    const nums = byTime.map(r => r.ls_attempt).filter(n => n != null);
    const counterSpan = nums.length
      ? ` · his counter ran ${Math.min(...nums)}–${Math.max(...nums)}`
      : '';
    document.getElementById('sub').textContent =
      (R ? `Big 20 ${R.name} · game ${R.n} of ${R.of || 20}${R.goal ? ' · ' + R.goal : ''} · ` : '') +
      `${played} attempt${played === 1 ? '' : 's'}, ${fins.length} finished` +
      (bestRun ? ` · best ${fmt(bestRun.final_time_ms)}` : '') +
      (played > 1 ? ` · ${dshort(byTime[0].started_at_ms)} to ${dshort(byTime[played - 1].started_at_ms)}` : '');
    if (R) {
      document.getElementById('sub').insertAdjacentHTML('beforeend',
        ' · <a href="/big20/index.html">the race</a>');
    }

    // The figures, as tiles.
    const tile = (v, label, sub, cls) =>
      `<div class="tile"><b class="${cls || ''}">${v}</b><span>${label}</span>${sub ? `<small>${sub}</small>` : ''}</div>`;
    const tiles = document.getElementById('tiles');
    tiles.hidden = false;
    tiles.innerHTML =
      tile(played, played === 1 ? 'attempt' : 'attempts', `over ${days.length} day${days.length === 1 ? '' : 's'}` + counterSpan) +
      tile(fins.length, 'finished', played ? `${rate}% of attempts` : '') +
      tile(bestRun ? fmt(bestRun.final_time_ms) : '—', 'best',
           bestRun ? `#${bestRun.attempt_number} · ${dshort(bestRun.started_at_ms)}` : 'no finish yet', 'gold') +
      tile(latest ? fmt(latest.final_time_ms) : '—', 'latest finish',
           latest && latest !== bestRun ? `+${fmt(latest.final_time_ms - bestRun.final_time_ms)} off the best`
           : latest ? 'is the best' : '') +
      tile(avg != null ? fmt(avg) : '—', 'average finish', fins.length > 1 ? `over ${fins.length} finishes` : '') +
      (R && R.marathon_ms != null
        ? tile(fmt(R.marathon_ms), 'in an Arcathlon', `${dshort(R.marathon_at_ms)} · not practice`) : '');

    // The chart: attempts left to right, time up. A finish is a point on
    // the line (green when it was a new best); a reset is a bar up to where
    // the timer was; his Arcathlon time, where there is one, is a dashed
    // rule to measure the finishes against.
    if (byTime.length) {
      const W = 860, H = 230, L = 56, Rm = 14, T = 12, B = 30;
      const top0 = Math.max(...byTime.map(r => r.depth || 0), R && R.marathon_ms || 0, 1);
      const steps = [10e3, 15e3, 30e3, 60e3, 120e3, 300e3, 600e3, 900e3, 1800e3, 3600e3];
      const step = steps.find(s => top0 / s <= 5) || 3600e3;
      const top = Math.ceil(top0 * 1.04 / step) * step;
      const n = byTime.length;
      const x = i => n === 1 ? (L + W - Rm) / 2 : L + i * (W - L - Rm) / (n - 1);
      const y = v => T + (1 - v / top) * (H - T - B);
      const tick = v => v >= 3600e3 ? `${Math.floor(v / 3600e3)}:${String(Math.floor(v / 60e3) % 60).padStart(2, '0')}:00`
                      : v % 60e3 === 0 ? `${v / 60e3}:00` : `${Math.floor(v / 60e3)}:${String((v / 1e3) % 60).padStart(2, '0')}`;
      let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(played + ' attempts')}">`;
      for (let v = 0; v <= top; v += step) {
        svg += `<line class="grid" x1="${L}" x2="${W - Rm}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>` +
               `<text class="lbl" x="${L - 8}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${tick(v)}</text>`;
      }
      if (R && R.marathon_ms != null) {
        svg += `<line class="goalline" x1="${L}" x2="${W - Rm}" y1="${y(R.marathon_ms).toFixed(1)}" y2="${y(R.marathon_ms).toFixed(1)}"/>`;
      }
      // Day labels along the bottom, one per first attempt of a day.
      let lastDay = null;
      byTime.forEach((r, i) => {
        if (r.day !== lastDay) {
          svg += `<text class="lbl" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : n > 1 && i === n - 1 ? 'end' : 'middle'}">${esc(dshort(r.started_at_ms))}</text>`;
          lastDay = r.day;
        }
      });
      const w = Math.max(2, Math.min(10, (W - L - Rm) / Math.max(n, 1) * 0.5));
      byTime.forEach((r, i) => {
        if (!r.fin && r.depth != null) {
          svg += `<line class="rs" x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${y(0).toFixed(1)}" y2="${y(r.depth).toFixed(1)}" style="stroke-width:${w.toFixed(1)}"><title>${esc('#' + r.attempt_number + ' · ' + dshort(r.started_at_ms) + ' · reset at ' + fmt(r.depth))}</title></line>`;
        }
      });
      const pts = byTime.map((r, i) => r.fin ? `${x(i).toFixed(1)},${y(r.final_time_ms).toFixed(1)}` : null).filter(Boolean);
      if (pts.length > 1) svg += `<polyline class="line" points="${pts.join(' ')}"/>`;
      byTime.forEach((r, i) => {
        if (r.fin) {
          svg += `<circle class="${r.pb ? 'pb' : 'fin'}" cx="${x(i).toFixed(1)}" cy="${y(r.final_time_ms).toFixed(1)}" r="4.5"><title>${esc('#' + r.attempt_number + ' · ' + dshort(r.started_at_ms) + ' · ' + fmt(r.final_time_ms) + (r.pb ? ' · new best' : ''))}</title></circle>`;
        }
      });
      svg += '</svg>';
      const chart = document.getElementById('chart');
      chart.hidden = false;
      chart.innerHTML = svg +
        `<div class="legend"><span><i class="fin"></i>finish</span><span><i class="pb"></i>new best</span>` +
        `<span><i class="rs"></i>reset, as far as the timer got</span>` +
        (R && R.marathon_ms != null ? `<span><i class="mar"></i>his Arcathlon time</span>` : '') + `</div>`;
    }

    // The attempts, by day, newest first. The bar is how far each got,
    // on one scale for the whole page, so a reset deep into the game
    // reads as what it was.
    const top = Math.max(...byTime.map(r => r.depth || 0), 1);
    const rows = [...byTime].reverse();
    // The number is LiveSplit's own where the bot read it off his counter,
    // and the bot's ordinal (#n) where it did not.
    let html = `<tr><th class="n">run</th><th class="num">Result</th><th class="bar">How far</th><th>Against the best</th></tr>`;
    let day = null;
    for (const r of rows) {
      if (r.day !== day) {
        day = r.day;
        const ofDay = byTime.filter(x => x.day === day);
        const f = ofDay.filter(x => x.fin);
        const b = f.length ? Math.min(...f.map(x => x.final_time_ms)) : null;
        html += `<tr class="day"><td colspan="4">${esc(dshort(r.started_at_ms))}<small>${ofDay.length} attempt${ofDay.length === 1 ? '' : 's'}` +
                `${f.length ? ` · ${f.length} finished · best ${fmt(b)}` : ' · no finish'}</small></td></tr>`;
      }
      const pct = r.depth != null ? Math.max(1, Math.min(100, 100 * r.depth / top)) : 0;
      const against = r.fin
        ? (r === bestRun ? '<span class="delta">the best</span>'
           : `<span class="delta">+${fmt(r.final_time_ms - bestRun.final_time_ms)}</span>`)
        : (r.depth != null && bestRun
           ? `<span class="delta">reset at ${Math.round(100 * r.depth / bestRun.final_time_ms)}% of the best</span>`
           : r.depth != null ? '<span class="delta">reset</span>' : '');
      html += `<tr>
        <td class="n tnum">${r.ls_attempt != null ? r.ls_attempt : r.attempt_number != null ? '#' + r.attempt_number : ''}</td>
        <td class="num tnum${r === bestRun ? ' best' : ''}">${
          r.fin ? fmt(r.final_time_ms) + (r.pb && r !== bestRun ? '<span class="tag">new best</span>' : '')
          : r.depth != null ? `<span class="none">reset at ${fmt(r.depth)}</span>`
          : '<span class="none">—</span>'}</td>
        <td class="bar"><div class="depth"><i class="${r === bestRun ? 'pb' : r.fin ? 'fin' : ''}" style="width:${pct.toFixed(1)}%"></i></div></td>
        <td>${against}</td>
      </tr>`;
    }
    document.getElementById('grid').innerHTML = html;
    if (marathon.length) {
      html = `<tr class="day"><td colspan="4">In his full runs and Arcathlons<small>race conditions, not practice attempts</small></td></tr>` +
        marathon.slice().reverse().map(r => `<tr>
          <td class="n tnum"></td>
          <td class="num tnum">${r.final_time_ms != null ? fmt(r.final_time_ms) : '<span class="none">—</span>'}</td>
          <td class="bar"></td>
          <td class="delta">${esc(dshort(r.started_at_ms))} · ${r.href ? `<a href="${r.href}">${esc(r.event)}</a>` : esc(r.event)}</td>
        </tr>`).join('');
      document.getElementById('grid').insertAdjacentHTML('beforeend', html);
    }
    document.getElementById('note').textContent =
      'Every attempt, newest first, by day. A finish shows its time, with the fastest marked and each new best tagged; a reset shows how far the timer had got. The bars share one scale, so a reset deep into the game reads as what it was.' +
      (D.race ? ` Practice for Big 20 ${D.race.name}, game ${D.race.n} of ${D.race.of || 20}.` : '');
  } else {
    document.getElementById('grid').innerHTML =
      `<tr><th>Date</th><th>Event</th><th class="num">Time</th></tr>` +
      runs.map(r => `<tr>
        <td class="tnum">${dshort(r.started_at_ms)}</td>
        <td>${r.href ? `<a href="${r.href}">${esc(r.event)}</a>` : esc(r.event)}</td>
        <td class="num tnum${r.final_time_ms != null && r.final_time_ms === best ? ' best' : ''}">${
          r.final_time_ms != null ? fmt(r.final_time_ms) : '<span class="none">—</span>'}</td>
      </tr>`).join('');
    document.getElementById('note').textContent = played > 1
      ? 'The fastest running is marked. Times are the game’s own segment of the marathon, as its board recorded it.'
      : 'Run once so far. The time is the game’s own segment of the marathon, as its board recorded it.';
  }
} else if (D.kind === 'draw') {

  // One day, one draw, ten games in the order they came up. Nothing to
  // compare it to by design: these ten were pulled from all ninety and
  // this combination happened once.
  const e = D.cycles[0];
  document.getElementById('sub').textContent =
    `${dshort(e.started_at_ms)} · ten games drawn from all ninety · ${fmt(e.total_ms)} of running`;
  document.getElementById('grid').innerHTML =
    `<tr><th></th><th>Game</th><th class="num">Time</th></tr>` +
    e.games.map((g, i) => `<tr>
      <td class="n tnum">${i + 1}</td>
      <td>${esc(g.game)}</td>
      <td class="num tnum">${g.final_time_ms != null ? fmt(g.final_time_ms) : '<span class="none">—</span>'}</td>
    </tr>`).join('') +
    `<tfoot><tr><td></td><td>Total</td><td class="num tnum">${fmt(e.total_ms)}</td></tr></tfoot>`;
  document.getElementById('note').textContent =
    'A randomized Arcathlon draws its ten from the whole pool, so this line-up ran once and will not recur.';
} else {
  // The same ten games, three or four times over. One column per running.
  const cycles = D.cycles;
  const names = [...new Set(cycles.flatMap(c => c.games.map(g => g.game)))].sort();
  const timeOf = (c, name) => {
    const g = c.games.find(x => x.game === name);
    return g ? g.final_time_ms : null;
  };
  document.getElementById('sub').textContent =
    `${names.length} games · run ${cycles.length} times between ` +
    `${dshort(cycles[cycles.length - 1].started_at_ms)} and ${dshort(cycles[0].started_at_ms)}`;

  const head = `<tr><th>Game</th>` +
    cycles.map(c => `<th class="num">${dshort(c.started_at_ms)}</th>`).join('') + `</tr>`;
  const body = names.map(name => {
    const times = cycles.map(c => timeOf(c, name));
    const best = Math.min(...times.filter(t => t != null));
    return `<tr><td>${esc(name)}</td>` + times.map(t => t == null
      ? `<td class="num tnum none">—</td>`
      : `<td class="num tnum${t === best ? ' best' : ''}">${fmt(t)}</td>`).join('') + `</tr>`;
  }).join('');
  const totals = `<tfoot><tr><td>Total</td>` +
    cycles.map(c => `<td class="num tnum">${fmt(c.total_ms)}</td>`).join('') + `</tr></tfoot>`;
  document.getElementById('grid').innerHTML = head + body + totals;

  // Blanks WITHIN the grid are cycles where a game read badly. A roster
  // short of ten is different and worth saying out loud: it means a game
  // of this event was never captured in any running of it, which is a
  // hole in the record rather than a gap in a row.
  const gaps = names.length * cycles.length -
    cycles.reduce((n, c) => n + c.games.filter(g => g.final_time_ms != null).length, 0);
  const short = 10 - names.length;
  document.getElementById('note').textContent =
    'The fastest running of each game is marked.' +
    (gaps ? ` ${gaps} cell${gaps > 1 ? 's are' : ' is'} blank: the board never gave a reading` +
            ` the tracker would accept there.` : '') +
    (short > 0 ? ` This event runs ten games; ${short} ${short > 1 ? 'are' : 'is'} missing from` +
                 ` the record entirely, never captured in any running of it.` : '');
}
</script>
