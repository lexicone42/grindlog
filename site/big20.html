<!-- Preparation for one Big 20 race, as its own page. Rendered by
     scripts/build-site.sh from the report's `big20` block, which is the
     race's twenty games in RACE ORDER joined against what the database
     holds for each, every practice attempt included. Do not write the data
     placeholder's name in prose anywhere in this file: the splice takes the
     whole line, and a mention in a comment silently ate the data once
     already.

     What the page is for: the empty rows. A leaderboard shows what has
     been done; a prep page has to show what is left, so all twenty are
     listed whether or not he has touched them, in the sequence he will
     run them on the day.

     What it adds up to: the race is the twenty back to back, so the number
     that matters is the SUM — of his bests (the ceiling) and of his latest
     finishes (what a race day would look like). Both are shown over the
     games that have a finish, with the games that do not named, because a
     sum over nineteen is not a race time.

     Two columns that look alike and are not:
       PRACTICE — attempts under his own splits for this race. This is what
         `game.follow_title = "track"` records, and it is what preparing
         looks like: many attempts, some finished.
       ARCATHLON — his time for that game in one of his own marathons. Six
         of these twenty are also Arcathlon games. A completion from a
         marathon in July says something real about the game and is not
         practice for this race, so it sits in its own column and is never
         added to the other.

     The page names games, never the streamer. -->

<script>
const D = JSON.parse(document.getElementById('data').textContent);
// Game names reach this page from a roster file, the goals with them, but
// the same escaping applies as everywhere else on the site: nothing here
// is built by concatenating unescaped text into innerHTML.
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = ms => {
  if (ms == null) return '—';
  const t = Math.floor(ms / 100) / 10;
  const m = Math.floor(t / 60), s = (t - m * 60).toFixed(1).padStart(4, '0');
  return m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}:${s}` : `${m}:${s}`;
};
// Whole hours and minutes, for a total that is hours long.
const hm = ms => {
  const m = Math.round(ms / 60000);
  return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`;
};
const TZ = (D.day_offset_minutes || 0) * 60000;
const dshort = ms => ms == null ? '—' : new Date(ms + TZ).toLocaleDateString(undefined,
  { month: 'short', day: 'numeric', timeZone: 'UTC' });
const dayOf = s => new Date(s + 'T00:00:00Z').toLocaleDateString(undefined,
  { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
// The same slug scripts/build-site.sh names a game's directory with.
const slugOf = g => String(g).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const today = new Date(Date.now() + TZ);
const daysAgo = ms => Math.floor((today - new Date(ms + TZ)) / 86400000);

const games = D.games || [];
document.title = D.title;
document.getElementById('title').textContent = D.title;

// The header line: when the race is, how long is left, and where the rules
// live. A race whose date has passed says so rather than counting backwards.
const parts = [];
if (D.date) {
  const day = new Date(D.date + 'T00:00:00Z');
  const days = Math.round((day - today) / 86400000);
  const when = day.toLocaleDateString(undefined,
    { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
  parts.push(days > 1 ? `${when} · ${days} days away`
           : days === 1 ? `${when} · tomorrow`
           : days === 0 ? `${when} · today`
           : when);
}
parts.push(`${games.length} games, in race order`);
const sub = document.getElementById('sub');
sub.textContent = parts.join(' · ');
if (D.url) {
  sub.insertAdjacentHTML('beforeend',
    ` · <a href="${esc(D.url)}" rel="noopener">the rules</a>`);
}

// Per game, from its attempts in time order: the finishes, the best and
// when it was set, the latest finish, and which finishes were a new best.
for (const g of games) {
  const runs = (g.runs || []).slice().sort((a, b) => a.t - b.t);
  let best = null;
  for (const r of runs) {
    r.fin = r.o === 'finished' && r.ms != null;
    r.pb = r.fin && (best == null || r.ms < best);
    if (r.pb) best = r.ms;
    // How far the attempt got: the finish time, or where the timer was
    // when he reset.
    r.depth = r.fin ? r.ms : r.at;
  }
  const fins = runs.filter(r => r.fin);
  g.log = runs;
  g.fins = fins;
  g.bestRun = fins.reduce((m, r) => (m == null || r.ms < m.ms) ? r : m, null);
  g.latest = fins.length ? fins[fins.length - 1] : null;
  g.att = runs.length || g.attempts || 0;
  g.fin = fins.length || g.finished || 0;
  g.bestMs = g.bestRun ? g.bestRun.ms : g.best_ms;
  g.lastAt = runs.length ? runs[runs.length - 1].t : g.last_at_ms;
  // His best for the game to the race's goal, wherever he set it: a
  // practice attempt or a game inside a full run. Thirteen of the twenty
  // were quicker inside a run than in any attempt on their own, and a sum
  // of practice bests alone stood 65 minutes above what he had done.
  const cands = [g.bestMs, g.run_ms].filter(v => v != null);
  g.ceilMs = cands.length ? Math.min(...cands) : null;
  g.ceilInRun = g.ceilMs != null && g.run_ms != null && g.run_ms <= (g.bestMs ?? Infinity);
}
// The latest finish of each game, in practice or inside the most recent
// full run that reached it, whichever came later.
for (const g of games) {
  const inRun = (D.run_throughs || [])
    .filter(r => (r.segments || []).some(s => s.game === g.game && s.ms != null))
    .sort((a, b) => b.started_at_ms - a.started_at_ms)[0];
  const seg = inRun ? inRun.segments.find(s => s.game === g.game && s.ms != null) : null;
  const fromRun = seg ? { ms: seg.ms, t: inRun.started_at_ms } : null;
  g.latestAny = [g.latest, fromRun].filter(Boolean).sort((a, b) => b.t - a.t)[0] || null;
}

// Practised / finished / untouched, and the strip that shows which.
// "some" is attempted but never finished, which on a prep page is a
// different state from both done and not started.
const finished = games.filter(g => g.fin > 0).length;
const tried = games.filter(g => g.att > 0).length;
const attempts = games.reduce((n, g) => n + g.att, 0);
const finishes = games.reduce((n, g) => n + g.fin, 0);
const onTimer = games.reduce((n, g) => n + g.log.reduce((m, r) => m + (r.depth || 0), 0), 0);
const days = [...new Set(games.flatMap(g => g.log.map(r => r.day)))].sort();
document.getElementById('strip').innerHTML = games.map(g =>
  `<i class="${g.fin > 0 ? 'done' : g.att > 0 ? 'some' : ''}" title="${esc(g.n + '. ' + g.game)}"></i>`
).join('');
const tile = (v, label, sub) => `<div class="tile"><b>${v}</b><span>${label}</span>${sub ? `<small>${sub}</small>` : ''}</div>`;
document.getElementById('tiles').innerHTML =
  tile(`${finished}<span style="display:inline;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0"> / ${games.length}</span>`, 'finished') +
  tile(tried, 'practised') +
  tile(attempts, 'attempts', `${finishes} finished`) +
  tile(days.length, days.length === 1 ? 'practice day' : 'practice days', days.length ? `${dshort(new Date(days[0] + 'T00:00:00Z').getTime() - TZ)} – ${dshort(new Date(days[days.length - 1] + 'T00:00:00Z').getTime() - TZ)}` : '') +
  tile(onTimer ? hm(onTimer) : '—', 'on the timer');

// What the twenty add up to. The race is all of them back to back, so the
// sum is the figure — but only a sum over all twenty is a race time, so
// each is shown over the games it covers, with the rest named.
if (finished > 0) {
  const withBest = games.filter(g => g.ceilMs != null);
  const sob = withBest.reduce((n, g) => n + g.ceilMs, 0);
  const inRuns = withBest.filter(g => g.ceilInRun).length;
  const latest = games.filter(g => g.latestAny).reduce((n, g) => n + g.latestAny.ms, 0);
  const missing = games.filter(g => g.ceilMs == null).map(g => g.game);
  const over = `over ${withBest.length} of ${games.length} games`;
  const miss = missing.length
    ? `<div class="miss">without ${missing.length > 6 ? `${missing.length} games` : esc(missing.join(', '))}</div>`
    : '<div class="miss">all twenty</div>';
  const p = document.getElementById('project');
  p.hidden = false;
  p.innerHTML =
    `<div><div class="lbl">Sum of bests</div><div class="sum">${fmt(sob)}</div><div class="over">${over} — the ceiling; ${inRuns} set inside a full run</div>${miss}</div>` +
    `<div><div class="lbl">Sum of latest finishes</div><div class="sum plain">${fmt(latest)}</div><div class="over">${over}, practice or the last full run — nearer what a race day looks like</div>${miss}</div>` +
    fullRuns();
}
practiceRuns();

// His full runs of the race on its own board, newest first: how far each
// got, over how many games. The whole race is the number that matters and
// this is the nearest thing to it he has run.
function fullRuns() {
  const rs = D.run_throughs || [];
  if (!rs.length) return '';
  const done = rs.filter(r => r.games >= games.length && r.reached_ms != null);
  const best = done.length ? Math.min(...done.map(r => r.reached_ms)) : null;
  return `<div><div class="lbl">Practice runs</div><div class="runs"><b>${rs.length}</b> run${rs.length === 1 ? '' : 's'} of the twenty` +
    (best != null ? `, best <b>${fmt(best)}</b>` : `, none over all twenty yet`) + `</div>` +
    `<div class="miss"><a href="#runs-card">run by run below</a> · <a href="/big20/runs/index.html">game by game</a> · a run's games count under "Full run", not as attempts</div></div>`;
}

// The practice runs tracked run by run: the whole twenty on its own board,
// "Practice Run" in its title, which is the nearest thing to the race he
// runs before the day. Each run: how far it got, the clock at its end,
// how much of that was in the games and how much between them, and how it
// sits against his bests, in practice or inside a full run — where the run
// lost time and where it set one. A run in progress sits on top with the clock still running.
function practiceRuns() {
  const rs = (D.run_throughs || []).slice().sort((a, b) => a.started_at_ms - b.started_at_ms);
  if (!rs.length) return;
  const bestOf = new Map(games.map(g => [g.game, g.ceilMs]));
  const sob = games.every(g => g.ceilMs != null) ? games.reduce((n, g) => n + g.ceilMs, 0) : null;
  const live = D.live && D.live.category ? rs[rs.length - 1] : null;
  let prevDone = null;
  for (const r of rs) {
    const segs = (r.segments || []).filter(s => s.ms != null);
    r.inGame = segs.reduce((n, s) => n + s.ms, 0);
    r.between = r.reached_ms != null && r.reached_ms >= r.inGame ? r.reached_ms - r.inGame : null;
    r.deltas = segs.filter(s => bestOf.get(s.game) != null).map(s => ({ game: s.game, d: s.ms - bestOf.get(s.game) }));
    r.vsBests = r.deltas.length ? r.deltas.reduce((n, x) => n + x.d, 0) : null;
    r.complete = r.games >= games.length && r.reached_ms != null;
    r.live = r === live;
    r.vsPrev = r.complete && prevDone ? r.reached_ms - prevDone.reached_ms : null;
    if (r.complete) prevDone = r;
  }
  const done = rs.filter(r => r.complete);
  const best = done.length ? done.reduce((m, r) => r.reached_ms < m.reached_ms ? r : m) : null;
  document.getElementById('runs-h').hidden = false;
  const card = document.getElementById('runs-card');
  card.hidden = false;
  const head = `<p class="pr-head"><b>${rs.length}</b> practice run${rs.length === 1 ? '' : 's'} of the twenty` +
    (best ? ` · best <b>${fmt(best.reached_ms)}</b> on ${esc(dshort(best.started_at_ms))}` : ` · none over all twenty yet`) +
    (sob != null && best ? ` · sum of bests <b>${fmt(sob)}</b>, <b>${fmt(best.reached_ms - sob)}</b> above it` : sob != null ? ` · sum of bests <b>${fmt(sob)}</b>` : '') + `</p>`;
  const banner = live
    ? `<div class="pr-live">Run in progress · <b>${live.games}</b> of ${games.length} games so far` +
      (live.reached_ms != null ? `, <b>${fmt(live.reached_ms)}</b> on the clock at the last one` : '') + ` · the page refreshes every few minutes while he is live</div>`
    : '';
  card.innerHTML = head + banner + chart(rs, sob, best) + table(rs, best) +
    `<p class="pr-note">A run's clock is the marathon timer at the last game recorded. "Between games" is that clock less the games' own times: the transitions, and any pause. "Against his bests" sums, over the games the run reached, how far each was from his best for it, in practice or inside a full run; the games named are where the most went and where the run set a best.</p>`;

  function chart(rs, sob, best) {
    const W = 600, H = 160, L = 58, R = 16, T = 14, B = 26;
    const ys = rs.filter(r => r.reached_ms != null).map(r => r.reached_ms);
    if (sob != null) ys.push(sob);
    if (!ys.length) return '';
    let lo = Math.min(...ys), hi = Math.max(...ys);
    const pad = Math.max((hi - lo) * 0.25, 5 * 60000);
    lo -= pad; hi += pad;
    const x = i => rs.length === 1 ? (L + (W - R)) / 2 : L + (W - L - R) * i / (rs.length - 1);
    const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    const hms = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}`; };
    let out = `<svg class="pr-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="practice runs, the clock at the end of each">`;
    for (let k = 0; k <= 2; k++) {
      const v = lo + (hi - lo) * k / 2;
      out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>` +
        `<text class="tnum" x="${L - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${hms(v)}</text>`;
    }
    if (sob != null) {
      out += `<line class="sob" x1="${L}" x2="${W - R}" y1="${y(sob).toFixed(1)}" y2="${y(sob).toFixed(1)}"/>` +
        `<text class="sob-l tnum" x="${W - R}" y="${(y(sob) - 4).toFixed(1)}" text-anchor="end">sum of bests ${fmt(sob)}</text>`;
    }
    const pts = rs.map((r, i) => ({ r, cx: x(i), cy: r.reached_ms != null ? y(r.reached_ms) : null }));
    const joined = pts.filter(p => p.r.complete);
    if (joined.length > 1) out += `<polyline class="join" points="${joined.map(p => `${p.cx.toFixed(1)},${p.cy.toFixed(1)}`).join(' ')}"/>`;
    for (const p of pts) {
      if (p.cy == null) continue;
      const cls = p.r.live ? 'run live' : p.r === best ? 'run best' : p.r.complete ? 'run' : 'run part';
      out += `<circle class="${cls}" cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="4.5"><title>${esc(dshort(p.r.started_at_ms))}: ${p.r.games} of ${games.length}, ${fmt(p.r.reached_ms)}</title></circle>`;
      if (!p.r.complete) out += `<text class="tnum" x="${p.cx.toFixed(1)}" y="${(p.cy - 8).toFixed(1)}" text-anchor="middle">${p.r.games}/${games.length}</text>`;
      out += `<text x="${p.cx.toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(dshort(p.r.started_at_ms))}</text>`;
    }
    return out + '</svg>';
  }

  function table(rs, best) {
    const newest = rs.slice().reverse();
    const sd = ms => (ms < 0 ? '−' : '+') + fmt(Math.abs(ms));
    const where = r => {
      const lose = r.deltas.filter(x => x.d > 0).sort((a, b) => b.d - a.d).slice(0, 2);
      const gain = r.deltas.filter(x => x.d < 0).sort((a, b) => a.d - b.d).slice(0, 2);
      const item = x => `<a href="/game/${slugOf(x.game)}/index.html">${esc(x.game)}</a> <b>${sd(x.d)}</b>`;
      return (lose.length ? `<div class="lose">lost most: ${lose.map(item).join(' · ')}</div>` : '') +
        (gain.length ? `<div class="gain">beat practice: ${gain.map(item).join(' · ')}</div>` : '');
    };
    const runSlug = r => {
      const same = rs.filter(x => x.day === r.day).sort((a, b) => a.started_at_ms - b.started_at_ms);
      const i = same.indexOf(r);
      return r.day + (i > 0 ? `-${i + 1}` : '');
    };
    const row = r => `<tr>` +
      `<td class="tnum"><a href="/big20/runs/${runSlug(r)}/index.html">${esc(dshort(r.started_at_ms))}</a>${r.live ? '<span class="tag">in progress</span>' : r === best ? '<span class="tag">best</span>' : ''}</td>` +
      `<td class="num tnum">${r.games}<span class="delta">of ${games.length}</span></td>` +
      `<td class="num tnum${r === best ? ' best' : ''}">${fmt(r.reached_ms)}${r.vsPrev != null ? `<span class="delta${r.vsPrev < 0 ? ' ahead' : ''}">${sd(r.vsPrev)} vs previous</span>` : ''}</td>` +
      `<td class="num tnum">${fmt(r.inGame)}</td>` +
      `<td class="num tnum">${fmt(r.between)}</td>` +
      `<td class="num tnum">${r.vsBests != null ? `<span class="${r.vsBests < 0 ? 'best' : ''}">${sd(r.vsBests)}</span><span class="delta">over ${r.deltas.length} game${r.deltas.length === 1 ? '' : 's'}</span>` : '—'}</td>` +
      `<td class="where">${where(r)}</td></tr>`;
    return `<div class="scroll"><table class="pr-table"><tr><th>Run</th><th class="num">Games</th><th class="num">Clock</th><th class="num">In the games</th><th class="num">Between games</th><th class="num">Against his bests</th><th>Where it went</th></tr>` +
      newest.map(row).join('') + `</table></div>`;
  }
}

// The trend cell: attempts left to right; a finish is a point (green when
// it was a new best), joined by a line; a reset is a tick at the depth the
// timer reached. One vertical scale per game, from zero to its slowest
// attempt, so a run that got further reads higher.
const spark = g => {
  const runs = g.log;
  if (!runs.length) return '';
  const W = 132, H = 30, pad = 3;
  const top = Math.max(...runs.map(r => r.depth || 0), 1);
  const x = i => runs.length === 1 ? W / 2 : pad + i * (W - 2 * pad) / (runs.length - 1);
  const y = v => H - pad - (v / top) * (H - 2 * pad);
  const pts = runs.map((r, i) => r.fin ? `${x(i).toFixed(1)},${y(r.ms).toFixed(1)}` : null).filter(Boolean);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-label="${esc(runs.length + ' attempts')}">` +
    (pts.length > 1 ? `<polyline class="line" points="${pts.join(' ')}"/>` : '') +
    runs.map((r, i) => r.fin
      ? `<circle class="${r.pb ? 'pb' : 'fin'}" cx="${x(i).toFixed(1)}" cy="${y(r.ms).toFixed(1)}" r="2.4"><title>${esc('#' + r.n + ' · ' + fmt(r.ms) + (r.pb ? ' · new best' : ''))}</title></circle>`
      : r.depth != null
        ? `<line class="rs" x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${(H - pad).toFixed(1)}" y2="${y(r.depth).toFixed(1)}"><title>${esc('#' + r.n + ' · reset at ' + fmt(r.depth))}</title></line>`
        : '').join('') +
    `</svg>`;
};

document.getElementById('grid').innerHTML =
  `<tr><th class="n">#</th><th class="game">Game</th>` +
  `<th class="num">Attempts</th><th class="num">Finished</th>` +
  `<th class="num">Best</th><th class="num">Latest</th><th class="trend">Trend</th>` +
  `<th class="num">Full run</th><th class="num">Arcathlon</th><th class="num last">Last</th></tr>` +
  games.map(g => {
    const rate = g.att ? Math.round(100 * g.fin / g.att) : null;
    const ago = g.lastAt == null ? null : daysAgo(g.lastAt);
    return `<tr class="${g.att > 0 ? '' : 'untouched'}">
    <td class="n tnum">${g.n}</td>
    <td class="game"><a href="/game/${slugOf(g.game)}/index.html">${esc(g.game)}</a><span class="goal">${esc(g.goal ?? '')}</span></td>
    <td class="num tnum">${g.att || '<span class="none">—</span>'}</td>
    <td class="num tnum">${g.fin ? `${g.fin} <span class="rate">${rate}%</span>` : '<span class="none">—</span>'}</td>
    <td class="num tnum${g.bestMs != null ? ' best' : ' none'}">${fmt(g.bestMs)}${g.bestRun ? `<span class="when">${esc(dshort(g.bestRun.t))}</span>` : ''}</td>
    <td class="num tnum${g.latest ? '' : ' none'}">${g.latest ? fmt(g.latest.ms) : '—'}${g.latest && g.latest !== g.bestRun ? `<span class="when">+${fmt(g.latest.ms - g.bestMs)}</span>` : ''}</td>
    <td class="trend">${spark(g)}</td>
    <td class="num tnum${g.run_ms != null ? '' : ' none'}"
        title="${g.run_ms != null ? 'his best for it inside a full run, ' + esc(dshort(g.run_at_ms)) + (g.run_count > 1 ? ', of ' + g.run_count : '') : ''}">${fmt(g.run_ms)}${g.run_ms != null ? `<span class="when">${esc(dshort(g.run_at_ms))}</span>` : ''}</td>
    <td class="num tnum${g.marathon_ms != null ? '' : ' none'}"
        title="${g.marathon_ms != null ? 'in an Arcathlon, ' + esc(dshort(g.marathon_at_ms)) : ''}">${fmt(g.marathon_ms)}</td>
    <td class="num last tnum ${g.lastAt == null ? 'none' : ago > 6 ? 'stale' : ''}">${
      g.lastAt == null ? '—' : ago === 0 ? 'today' : ago === 1 ? 'yesterday' : `${ago}d ago`}</td>
  </tr>`; }).join('');

document.getElementById('note').textContent = tried === 0
  ? 'Nothing recorded yet. Practice runs are recorded once the tracker is following the board he is timing; his marathon times for these games are shown where he has them.'
  : 'Attempts and finishes are his own practice for this race; each game links to every attempt. Latest is his most recent finish and how far off his best it was. In the trend, a point is a finish (green when it set a new best) and a tick is a reset, as far as the timer got. Full run is his best for the game inside a run of the whole race on its own board. The Arcathlon column is his time for the same game in one of his marathons — a real time, but not practice for this list, so it is never added to the rest.';

// The days, newest first: what he touched, how it went, and which bests
// were set. A prep log reads by day as much as by game.
if (days.length) {
  const byDay = new Map(days.map(d => [d, { att: 0, fin: 0, on: 0, games: new Set(), first: [], better: [] }]));
  for (const g of games) {
    let before = null;                 // his best going into the day
    let day = null, dayBest = null;
    const close = () => {
      if (day == null || dayBest == null) return;
      const d = byDay.get(day);
      if (before == null) d.first.push(`${esc(g.game)} <b>${fmt(dayBest)}</b>`);
      else if (dayBest < before) d.better.push(`${esc(g.game)} <b>${fmt(dayBest)}</b> <span class="from">from ${fmt(before)}</span>`);
      before = before == null ? dayBest : Math.min(before, dayBest);
    };
    for (const r of g.log) {
      if (r.day !== day) { close(); day = r.day; dayBest = null; }
      const d = byDay.get(r.day);
      d.att++; if (r.fin) d.fin++; d.on += r.depth || 0; d.games.add(g.game);
      if (r.fin && (dayBest == null || r.ms < dayBest)) dayBest = r.ms;
    }
    close();
  }
  document.getElementById('days-head').hidden = false;
  document.getElementById('days-card').hidden = false;
  document.getElementById('days').innerHTML =
    `<tr><th>Day</th><th class="num">Games</th><th class="num">Attempts</th><th class="num">Finished</th><th class="num">On the timer</th><th>Bests</th></tr>` +
    days.slice().reverse().map(day => { const d = byDay.get(day); return `<tr>
      <td class="tnum" style="white-space:nowrap">${esc(dayOf(day))}</td>
      <td class="num tnum">${d.games.size}</td>
      <td class="num tnum">${d.att}</td>
      <td class="num tnum">${d.fin || '<span class="none">—</span>'}</td>
      <td class="num tnum">${d.on ? hm(d.on) : '<span class="none">—</span>'}</td>
      <td class="pbs">${
        (d.better.length ? `<div>${d.better.join(' · ')}</div>` : '') +
        (d.first.length ? `<div class="firsts">${d.first.length > 6 ? `first finishes of ${d.first.length} games` : 'first finish: ' + d.first.join(' · ')}</div>` : '') ||
        '<span class="none">—</span>'}</td>
    </tr>`; }).join('');
}
</script>
