# Live shadow-mode config: watches twitch.tv/arcus, logs into the shared
# ninja-gaiden.db. Polls while he's offline (cadence under [stream]) and
# starts capturing automatically when he goes live with "ninja gaiden" in
# the title.
#
#   RUST_LOG=info ./target/release/ngtwitchtimer --config live.toml run
#
# That is a one-off run. The deployment runs the same command under
# scripts/run-live.sh (restart on exit, log rotation, one OpenMP thread),
# detached in tmux; only one bot should run against ninja-gaiden.db:
#   tmux new-session -d -s ngtimer ./scripts/run-live.sh
# New builds go out with scripts/rollout.sh, which expects that supervisor.
#
# Watch it work:   tail -f obs-live.jsonl
# Check the data:  ./target/release/ngtwitchtimer --config live.toml report

[stream]
channel = "arcus"
# source = "hls" (default): pure-Rust resolver + ffmpeg
# 480p30 reads timer, splits and the attempt counter as well as 1080p60
# (verified on VOD footage) at a fraction of the decode cost.
quality = "480p30"
# Two reads a second: attempts that die within three seconds get seen, and
# the run number is caught on far more of the short ones (measured: 23 -> 27
# of 27 numbered on one window). Cheap with the in-process OCR engine.
fps = 2
# No title_filter: capture every broadcast, not only the Ninja Gaiden days.
# He runs marathons of ten NES games and is doing twenty different games, and
# a day that is never captured leaves no session, no capture health, no
# observation log and no board snapshots to learn from.
#
# Nothing of another game reaches this game's rows, because nothing on those
# days locks: the marathon scene puts its pane where no configured layout
# looks, and four replayed windows of one read 0% of frames and never
# locked, so no timer is read and no run is written. That is a property of
# the layouts, not a guarantee, and the guarantee is being built where it
# belongs — in the split rows. Six rows labelled Act 1 to Act 6 against a
# comparison column totalling about 11:35 is his Ninja Gaiden pane; ten rows
# named after games with times in the tens of minutes is a marathon. The
# board says which, at every pane pass, and it reads far more reliably than
# the title row (which comes back "Ninja (NES", or with only its first word
# above the confidence gate). game.require_title_match stays off: a title
# string is the wrong thing to gate recording on.
# He goes live ~09:59 local. Poll every minute from 09:40 (the bot starts
# frequent polling ten minutes before the window start) until 20:30; outside
# that window check only every 30 minutes, cut short so a quiet sleep never
# runs past 09:40 (graceful on Twitch). Marathon days have run to 7.6 h from
# a 10:00 start, so they finish inside the window.
active_hours = ["09:50", "20:30"]
offline_poll_secs = 60
quiet_poll_secs = 1800

[ocr]
# "auto": the in-process engine when the binary was built with it (see
# scripts/build-release.sh), else the tesseract CLI. The language data lives
# in the extracted AppImage; only the in-process engine needs the path.
engine = "auto"
tessdata_path = "/home/bryan/.local/opt/tesseract-appimage/usr/share/tesseract-ocr/5/tessdata"

[timer]
# Calibrated against his VODs; sized for the widest time ("12:09.17").
crop_x = 285
crop_y = 800
crop_w = 390
crop_h = 100
threshold = 60
# A read that fails to parse is retried at these cutoffs (measured: the NES
# theme wants 75 where the default theme wants 60; both are covered).
retry_thresholds = [75, 45]
# The purpose-built digit reader (assets/glyphs.json, trained on both of his
# themes) reads the timer; tesseract reads only the frames it declines.
reader = "glyph"

[splits]
# LiveSplit's per-act cumulative-time column: detected splits enable
# !pace / !golds / !splits and per-act stats.
enabled = true
crop_x = 535
crop_y = 498
crop_w = 135
crop_h = 288

[detection]
# Nobody finishes NG Any% under 11:00 (WR 11:32): a "finish" below that is a
# frozen timer (stream stall, pause), not a run.
min_final_ms = 660000
# The counters below are frames, and this config analyses 2 fps: the default
# 180 unreadable frames before a run is written off as "disappeared" would be
# 90 s, and a mid-roll ad break runs longer than that. 360 keeps the three
# minutes the default was designed for. The confirmation counts are left at
# their defaults (they are met in half the wall time, which is fine: a
# frozen or advancing timer is just as certain after 2.5 s of frames).
illegible_reset_count = 360

[game]
name = "Ninja Gaiden (NES)"
category = "Any%"
# Read the whole pane at each pass, log which game the board would be filed
# under (one "layout" session event per distinct board) — and RECORD the runs
# of a board that names a game a shipped roster knows, under that game and
# `other_category`. He is preparing for a Big 20 race, twenty NES games he
# will spend weeks practising, and under "log" none of it was recorded.
#
# What makes this safe to turn on is how narrow it is: a board that convicts
# WITHOUT naming a game still records nothing, exactly as under "log", so
# this only ever widens capture to boards the rosters can identify. Measured
# on VOD 2868800526 — the broadcast that once produced twelve fabricated
# Ninja Gaiden runs — the Die Hard window records ten Die Hard runs and zero
# Ninja Gaiden, a Ninja Gaiden window is row-for-row identical to the same
# window under "log", and a Life Force block (an NES game on no roster)
# records nothing.
#
# Back to "log" is a one-word edit and a rollout; the runs it wrote are all
# `category = "Other"` and can be removed on their own.
follow_title = "track"
# The tracked best only spans what the bot has seen; his LiveSplit comparison
# is seasonal, so call it what it is.
record_label = "season best"
# His season best when tracking started, read off the LiveSplit comparison
# column (his comparison IS seasonal bests; he resets his splits file every
# season, roughly 3-4 months). Only a fallback: once the bot has read the
# season-best row off his layout it stores that value (settings key
# ls_season_best_ms), adopts it again at every start and follows the row
# when it changes, so a season rollover needs no edit here. NEW-record
# announcements must beat the current season best: the layout's once read,
# this value until then.
baseline_best = "11:35.1"
# Reference times for the records site / finish chart. A row the bot has
# read off his layout (settings ls_pb_ms / ls_wr_ms) replaces the entry with
# the same label, and build-site.sh's speedrun.com lookup only fills labels
# missing from this list, so the WR below is what the site shows until it is
# edited here or his layout shows a WR row.
references = [
  { label = "WR", time = "11:32.183" },
  # From speedrun.com (user Arcus, run date 2025-11-13, world rank 2)
  { label = "Lifetime PB", time = "11:33.933" },
]
# Cumulative act-end boundaries (padded above his PB splits) for the death
# chart / !deaths. Final act unbounded.
acts = [
  { name = "Act 1", end_ms = 58000 },
  { name = "Act 2", end_ms = 175000 },
  { name = "Act 3", end_ms = 262000 },
  { name = "Act 4", end_ms = 425000 },
  { name = "Act 5", end_ms = 585000 },
  { name = "Act 6" },
]

[database]
path = "ninja-gaiden.db"

[chat]
# To test chat WITHOUT posting in arcus' channel: create a bot account,
# get an IRC token, and point `channel` at YOUR OWN channel — the bot keeps
# watching arcus' stream but talks only where you say.
enabled = false
# channel = "yourchannel"
# username = "yourbotaccount"
# oauth_token = "oauth:..."
# mods = ["yourlogin"]
# Namespace for a shared channel: commands become !ngrust-pb, !ngrust-deaths,
# !ngrust-pace, !ngrust-status... (bare !pb is left to other bots).
command_prefix = "ngrust-"

[debug]
obs_log = "obs-live.jsonl"
# One line per pane pass: the board as read — title, counter, every row with
# its name and time cells. What explains, afterwards, why a board day went
# the way it did; without it, 2026-09-17 took twelve replay trials to see
# what the live bot was reading. A pass a minute; the supervisor rotates it
# with the obs log.
board_log = "boards-live.jsonl"

[attempts_counter]
# LiveSplit lifetime attempt counter in the layout header.
enabled = true
crop_x = 552
crop_y = 462
crop_w = 120
crop_h = 34

[lifetime_sob]
# LiveSplit "Sum of Best Segments" row (seasonal: his splits reset each
# season). This rectangle also sets how far below the timer the pane is
# decoded: the bot OCRs the union of the configured rectangles plus a 48px
# drift margin and reads every labelled time it finds under the timer there
# (Sum of Best, the year-labelled season best, PB, WR) at each layout lock.
# The season best and PB have been read this way; no WR row ever has. If his
# layout shows one below this row, extend crop_h to take it in.
enabled = true
crop_x = 540
crop_y = 912
crop_w = 130
crop_h = 36

# His second OBS scene (the "Ninja Gaiden"-themed purple/orange layout): the
# LiveSplit panel sits ~50px further left with tighter rows. The bot probes
# both layouts' timers and locks onto whichever parses.
[[layouts]]
name = "ng-theme"
timer = { crop_x = 265, crop_y = 765, crop_w = 360, crop_h = 100 }
splits = { crop_x = 515, crop_y = 513, crop_w = 100, crop_h = 252 }
attempts_counter = { crop_x = 540, crop_y = 487, crop_w = 80, crop_h = 30 }
lifetime_sob = { crop_x = 505, crop_y = 897, crop_w = 110, crop_h = 34 }

# His Big 20 practice panes. The LiveSplit window is top-anchored, so a
# game's timer sits as far down as its split rows push it: seven rows put it
# where the two layouts above expect (y~820), and those games recorded from
# the first day. One to four rows leave it 100-180 px HIGHER, with smaller
# digits, and the probe reaches 36 px — so Crisis Force, Uninvited, Faria,
# Monster Party, Parallel World, Mega Man 6, New Ghostbusters II and the rest
# were never even seen: no lock, no pane pass, no title read, no run. Found
# by `locate` on VOD 2875828002 (2026-09-16); the timer's right edge sat at
# x=595-604 on every sample and only its top moved.
#
# Measured timer digit boxes, 1080p canvas: (x, y, w, h)
#   1 row   408, 560, 194, 70   Mini Putt
#   1 row   437, 619, 167, 64   New Ghostbusters II
#   2 rows  359, 626, 245, 65   Crisis Force
#   3 rows  435, 666, 167, 65   Uninvited
#   4 rows  389, 677, 211, 59   the Faria .. Mega Man 6 block
#   4 rows  296, 786, 299, 80   a wider-pitch pane (clipped 1 px by ng-theme)
#   6 rows  410, 819, 189, 71   Kid Klown            (default: inside)
#   7 rows  423, 829, 177, 66   Flintstones          (default: inside)
# The attempt counter sits at the right end of the category line, in the
# title block at the top of the pane — top-anchored, so at the same place
# for every game whatever its row count. One rectangle serves all three; it
# is what gives the identity gate its second signal on a one-row pane whose
# rows cannot place the counter and whose header names nothing ("Traditional"
# on Mini Putt): 6 against a floor past 94,000.
# Three classes, three crops. One crop for the whole 560-736 span was tried
# and was worse: with the four-row panes at its bottom edge Uninvited and
# Faria stopped recording. Each crop below holds its class with 20+ px of
# slack at zero offset, and none takes in a whole split column, which is
# what a timer crop must never do. A crop that
# spanned all three classes would take in the split rows' own times above
# the timer, which is what a crop must never do.
[[layouts]]
name = "big20-top"
timer = { crop_x = 300, crop_y = 530, crop_w = 340, crop_h = 120 }
splits = { crop_x = 470, crop_y = 440, crop_w = 150, crop_h = 100 }
attempts_counter = { crop_x = 545, crop_y = 448, crop_w = 90, crop_h = 50 }

[[layouts]]
name = "big20-short"
timer = { crop_x = 300, crop_y = 598, crop_w = 340, crop_h = 162 }
splits = { crop_x = 470, crop_y = 462, crop_w = 150, crop_h = 216 }
attempts_counter = { crop_x = 545, crop_y = 448, crop_w = 90, crop_h = 50 }

[[layouts]]
name = "big20-mid"
timer = { crop_x = 250, crop_y = 755, crop_w = 470, crop_h = 160 }
splits = { crop_x = 480, crop_y = 480, crop_w = 135, crop_h = 300 }
attempts_counter = { crop_x = 545, crop_y = 448, crop_w = 90, crop_h = 50 }

# His marathon days: the pane's title reads "Randomized Arcathlon",
# "Arcathlon #6" and, when OCR damages it, "Randomized Areathion" or
# "Arcathton £4". Both words are listed because the second falls under the
# confidence gate on the 1080p board and only "Randomized" is read. In
# shadow mode this only decides what the log calls the board.
[[games]]
name = "Arcathlon"
category = "10 games"
match = ["arcath", "randomized"]

# The race board itself, first seen 2026-09-17: "Big 20 #23 / Practice Run",
# the twenty games two rows each (the game, then its category in brackets)
# under the webcam, columns +/- | Game | Total, the timer in a light band at
# the foot of the pane with a small segment timer beneath it. No attempt
# counter. The splits crop starts at the game names (x=128), not the pane's
# edge: from x=75 the capture union reached the stream's left margin, and the
# pixel-art sprites there read as words in the Ninja Gaiden pane's title band
# and convicted his own board ("st ot" for its title). The timer crop is the
# big digits only, with room on the left for
# two-digit minutes and the hours digit the race total will grow: the first
# crop (from `locate` on a "1:50" reading) had "17:10" touching its left edge,
# which the probe rightly refuses as clipped, and took in the small segment
# timer beneath, which halved the read rate. The splits crop is wide enough
# to take the title rows in with the time columns.
[[layouts]]
name = "big20-race"
# The marathon clock is right-aligned and grows to the LEFT as the hours
# come: a crop that fitted "10:18.3" cut the hour digit of "3:55:28.3" and
# tesseract read "155:09.3". Wide enough for h:mm:ss.d with the re-anchor's
# drift on top (measured +22 px); an unused margin costs nothing.
timer = { crop_x = 320, crop_y = 950, crop_w = 262, crop_h = 62 }
splits = { crop_x = 128, crop_y = 450, crop_w = 492, crop_h = 465 }

# The race board — "Big 20 #23 / Practice Run", the twenty games two rows each
# (the game, then its category in brackets: the transition into the next),
# tracked by its rows like an Arcathlon board, every completed row a run of
# its game under this category, named by the race roster. The layout probe
# locks on this board by its pane (the timer sits where no crop can hold it
# cleanly); see the board probe in app.rs. First seen 2026-09-17.
[[games]]
name = "Big 20 #23 run"
category = "Big 20 #23 run"
match = ["big 20", "big20", "practice run"]
mode = "board"
roster = "assets/big20-roster.toml"
