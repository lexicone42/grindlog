# Live shadow-mode config: watches twitch.tv/arcus, logs into the shared
# ninja-gaiden.db. Polls while he's offline (cadence under [stream]) and
# starts capturing automatically when he goes live with "ninja gaiden" in
# the title.
#
#   RUST_LOG=info ./target/release/ngtwitchtimer --config live.toml run
#
# That is a one-off run. The deployment runs the same command under
# scripts/run-live.sh (restart on exit, log rotation, one OpenMP thread),
# detached in tmux; only one bot should run against ninja-gaiden.db:
#   tmux new-session -d -s ngtimer ./scripts/run-live.sh
# New builds go out with scripts/rollout.sh, which expects that supervisor.
#
# Watch it work:   tail -f obs-live.jsonl
# Check the data:  ./target/release/ngtwitchtimer --config live.toml report

[stream]
channel = "arcus"
# source = "hls" (default): pure-Rust resolver + ffmpeg
# 480p30 reads timer, splits and the attempt counter as well as 1080p60
# (verified on VOD footage) at a fraction of the decode cost.
quality = "480p30"
# Two reads a second: attempts that die within three seconds get seen, and
# the run number is caught on far more of the short ones (measured: 23 -> 27
# of 27 numbered on one window). Cheap with the in-process OCR engine.
fps = 2
# Only capture his Ninja Gaiden days — Arcathlon and other streams are
# skipped (the bot keeps polling in case he switches mid-day).
title_filter = "ninja gaiden"
# He goes live ~09:59 local. Poll every minute from 09:40 (the bot starts
# frequent polling ten minutes before the window start) until 20:30; outside
# that window check only every 30 minutes, cut short so a quiet sleep never
# runs past 09:40 (graceful on Twitch).
active_hours = ["09:50", "20:30"]
offline_poll_secs = 60
quiet_poll_secs = 1800

[ocr]
# "auto": the in-process engine when the binary was built with it (see
# scripts/build-release.sh), else the tesseract CLI. The language data lives
# in the extracted AppImage; only the in-process engine needs the path.
engine = "auto"
tessdata_path = "/home/bryan/.local/opt/tesseract-appimage/usr/share/tesseract-ocr/5/tessdata"

[timer]
# Calibrated against his VODs; sized for the widest time ("12:09.17").
crop_x = 285
crop_y = 800
crop_w = 390
crop_h = 100
threshold = 60
# A read that fails to parse is retried at these cutoffs (measured: the NES
# theme wants 75 where the default theme wants 60; both are covered).
retry_thresholds = [75, 45]
# The purpose-built digit reader (assets/glyphs.json, trained on both of his
# themes) reads the timer; tesseract reads only the frames it declines.
reader = "glyph"

[splits]
# LiveSplit's per-act cumulative-time column: detected splits enable
# !pace / !golds / !splits and per-act stats.
enabled = true
crop_x = 535
crop_y = 498
crop_w = 135
crop_h = 288

[detection]
# Nobody finishes NG Any% under 11:00 (WR 11:32): a "finish" below that is a
# frozen timer (stream stall, pause), not a run.
min_final_ms = 660000
# The counters below are frames, and this config analyses 2 fps: the default
# 180 unreadable frames before a run is written off as "disappeared" would be
# 90 s, and a mid-roll ad break runs longer than that. 360 keeps the three
# minutes the default was designed for. The confirmation counts are left at
# their defaults (they are met in half the wall time, which is fine: a
# frozen or advancing timer is just as certain after 2.5 s of frames).
illegible_reset_count = 360

[game]
name = "Ninja Gaiden (NES)"
category = "Any%"
# The tracked best only spans what the bot has seen; his LiveSplit comparison
# is seasonal, so call it what it is.
record_label = "season best"
# His season best when tracking started, read off the LiveSplit comparison
# column (his comparison IS seasonal bests; he resets his splits file every
# season, roughly 3-4 months). Only a fallback: once the bot has read the
# season-best row off his layout it stores that value (settings key
# ls_season_best_ms), adopts it again at every start and follows the row
# when it changes, so a season rollover needs no edit here. NEW-record
# announcements must beat the current season best: the layout's once read,
# this value until then.
baseline_best = "11:35.1"
# Reference times for the records site / finish chart. A row the bot has
# read off his layout (settings ls_pb_ms / ls_wr_ms) replaces the entry with
# the same label, and build-site.sh's speedrun.com lookup only fills labels
# missing from this list, so the WR below is what the site shows until it is
# edited here or his layout shows a WR row.
references = [
  { label = "WR", time = "11:32.183" },
  # From speedrun.com (user Arcus, run date 2025-11-13, world rank 2)
  { label = "Lifetime PB", time = "11:33.933" },
]
# Cumulative act-end boundaries (padded above his PB splits) for the death
# chart / !deaths. Final act unbounded.
acts = [
  { name = "Act 1", end_ms = 58000 },
  { name = "Act 2", end_ms = 175000 },
  { name = "Act 3", end_ms = 262000 },
  { name = "Act 4", end_ms = 425000 },
  { name = "Act 5", end_ms = 585000 },
  { name = "Act 6" },
]

[database]
path = "ninja-gaiden.db"

[chat]
# To test chat WITHOUT posting in arcus' channel: create a bot account,
# get an IRC token, and point `channel` at YOUR OWN channel — the bot keeps
# watching arcus' stream but talks only where you say.
enabled = false
# channel = "yourchannel"
# username = "yourbotaccount"
# oauth_token = "oauth:..."
# mods = ["yourlogin"]
# Namespace for a shared channel: commands become !ngrust-pb, !ngrust-deaths,
# !ngrust-pace, !ngrust-status... (bare !pb is left to other bots).
command_prefix = "ngrust-"

[debug]
obs_log = "obs-live.jsonl"

[attempts_counter]
# LiveSplit lifetime attempt counter in the layout header.
enabled = true
crop_x = 552
crop_y = 462
crop_w = 120
crop_h = 34

[lifetime_sob]
# LiveSplit "Sum of Best Segments" row (seasonal: his splits reset each
# season). This rectangle also sets how far below the timer the pane is
# decoded: the bot OCRs the union of the configured rectangles plus a 48px
# drift margin and reads every labelled time it finds under the timer there
# (Sum of Best, the year-labelled season best, PB, WR) at each layout lock.
# The season best and PB have been read this way; no WR row ever has. If his
# layout shows one below this row, extend crop_h to take it in.
enabled = true
crop_x = 540
crop_y = 912
crop_w = 130
crop_h = 36

# His second OBS scene (the "Ninja Gaiden"-themed purple/orange layout): the
# LiveSplit panel sits ~50px further left with tighter rows. The bot probes
# both layouts' timers and locks onto whichever parses.
[[layouts]]
name = "ng-theme"
timer = { crop_x = 265, crop_y = 765, crop_w = 360, crop_h = 100 }
splits = { crop_x = 515, crop_y = 513, crop_w = 100, crop_h = 252 }
attempts_counter = { crop_x = 540, crop_y = 487, crop_w = 80, crop_h = 30 }
lifetime_sob = { crop_x = 505, crop_y = 897, crop_w = 110, crop_h = 34 }
