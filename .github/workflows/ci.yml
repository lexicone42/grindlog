name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: build
        run: cargo build --release
      # Unit tests exercise parsing, the state machine, pane geometry, the
      # splits and attempt-counter trackers, the glyph reader against the
      # real crops in tests/fixtures/glyph (with assets/glyphs.json), the
      # SQLite queries and both checked-in configs; none of them need
      # tesseract or ffmpeg. The in-process OCR engine (--features
      # leptess-ocr, which scripts/build-release.sh ships) needs
      # libtesseract/libleptonica and is not compiled here.
      - name: test
        run: cargo test --release
      - name: scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
